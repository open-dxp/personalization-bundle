name: "Static Analysis"

on:
    schedule:
        - cron: '0 3 * * 1,3,5'
    pull_request:
        branches:
            - "[0-9]+.[0-9]+"
            - "[0-9]+.x"
        paths-ignore:
            - 'doc/**'
            - 'src/Resources/public/**'
    push:
        branches:
            - "[0-9]+.[0-9]+"
            - "[0-9]+.x"
        paths-ignore:
            - 'doc/**'
            - 'src/Resources/public/**'

jobs:
    static-analysis-phpstan:
        name: "Static Analysis with PHPStan"
        runs-on: "ubuntu-latest"
        continue-on-error: ${{ matrix.experimental }}
        strategy:
            matrix:
                include:
                    - { php-version: "8.1", dependencies: "lowest", opendxp_version: "", phpstan_args: "", experimental: false }
                    - { php-version: "8.2", dependencies: "highest", phpstan_args: "", experimental: false }
                    - { php-version: "8.3", dependencies: "highest", opendxp_version: "11.5", phpstan_args: "", experimental: true }
        steps:
            -   name: "Checkout code"
                uses: "actions/checkout@v2"

            -   name: "Install PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    coverage: "none"
                    php-version: "${{ matrix.php-version }}"

            -   name: "Setup OpenDxp environment"
                run: |
                    .github/ci/scripts/setup-opendxp-environment.sh

            -   name: "Update OpenDxp version"
                env:
                    OPENDXP_VERSION: "${{ matrix.opendxp_version }}"
                run: |
                    if [ ! -z "$OPENDXP_VERSION" ]; then
                          composer require --no-update open-dxp/opendxp:${OPENDXP_VERSION}
                          composer require --no-update open-dxp/admin-bundle:1.0
                    fi                  

            -   name: "Install dependencies with Composer"
                uses: "ramsey/composer-install@v1"
                with:
                    dependency-versions: "${{ matrix.dependencies }}"

            -   name: "Run a static analysis with phpstan/phpstan"
                run: "vendor/bin/phpstan analyse ${{ matrix.phpstan_args }} -c phpstan.neon --memory-limit=-1"
