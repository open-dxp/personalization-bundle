services:
    _defaults:
        autowire: true
        autoconfigure: true

    #
    # TARGETING STORAGE
    #
    # The TargetingStorageInterface alias will be set to whatever service_id is configured
    # in opendxp_personalization.targeting.service_id. The services below are just the core storages, but
    # it's possible to define a custom service which can be configured via service_id.
    #

    # Cookie
    OpenDxp\Bundle\PersonalizationBundle\Targeting\Storage\Cookie\JWTCookieSaveHandler:
        arguments:
            $secret: '%kernel.secret%'

    # NOTE: using this save handler is inherently insecure and can open vulnerabilities by injecting malicious data into the
    # client cookie. Use only for testing!
    OpenDxp\Bundle\PersonalizationBundle\Targeting\Storage\Cookie\JsonCookieSaveHandler: ~

    OpenDxp\Bundle\PersonalizationBundle\Targeting\Storage\CookieStorage:
        arguments:
            $saveHandler: '@OpenDxp\Bundle\PersonalizationBundle\Targeting\Storage\Cookie\JWTCookieSaveHandler'

    # Session Storage.
    # If this is used, the opendxp_personalization.targeting.session.enabled entry
    # must be set to true to load the session configurator.

    OpenDxp\Bundle\PersonalizationBundle\Targeting\Storage\SessionStorage: ~

    # Database

    OpenDxp\Bundle\PersonalizationBundle\Targeting\Storage\DbStorage: ~

    # Example for redis
    # opendxp_personalization.targeting.storage.redis.connection:
    #    class: Credis_Client
    #    factory: [OpenDxp\Storage\Redis\ConnectionFactory, createConnection]
    #    arguments:
    #        - { server: 127.0.0.1, database: 7 }

    # OpenDxp\Bundle\PersonalizationBundle\Targeting\Storage\RedisStorage:
    #     arguments:
    #         $redis: '@opendxp_personalization.targeting.storage.redis.connection'

    # Example for fallback
    # OpenDxp\Bundle\PersonalizationBundle\Targeting\Storage\FallbackStorage:
    #    arguments:
    #        $primaryStorage: '@OpenDxp\Bundle\PersonalizationBundle\Targeting\Storage\DbStorage'
    #        $fallbackStorage: '@OpenDxp\Bundle\PersonalizationBundle\Targeting\Storage\CookieStorage'


    #
    # VISITOR INFO
    #

    OpenDxp\Bundle\PersonalizationBundle\Targeting\VisitorInfoStorageInterface: '@OpenDxp\Bundle\PersonalizationBundle\Targeting\VisitorInfoStorage'
    OpenDxp\Bundle\PersonalizationBundle\Targeting\VisitorInfoStorage: ~
    OpenDxp\Bundle\PersonalizationBundle\Targeting\VisitorInfoResolver: ~


    #
    # DATA PROVIDERS
    #

    GeoIp2\ProviderInterface: '@GeoIp2\Database\Reader'
    GeoIp2\Database\Reader:
        arguments:
            $filename: '%opendxp.geoip.db_file%'

    OpenDxp\Bundle\PersonalizationBundle\Targeting\DataLoaderInterface: '@OpenDxp\Bundle\PersonalizationBundle\Targeting\DataLoader'

    OpenDxp\Bundle\PersonalizationBundle\Targeting\DataLoader: ~

    OpenDxp\Bundle\PersonalizationBundle\Targeting\DataProvider\GeoIp:
        calls:
            - [ setCache, [ '@OpenDxp\Cache\Core\CoreCacheHandler' ] ]

    OpenDxp\Bundle\PersonalizationBundle\Targeting\DataProvider\GeoLocation: ~

    OpenDxp\Bundle\PersonalizationBundle\Targeting\DataProvider\Device:
        calls:
            - [ setCache, [ '@OpenDxp\Cache\Core\CoreCacheHandler' ] ]
            - [ setCachePool, [ '@opendxp.cache.pool' ] ]

    OpenDxp\Bundle\PersonalizationBundle\Targeting\DataProvider\TargetingStorage: ~

    OpenDxp\Bundle\PersonalizationBundle\Targeting\Service\VisitedPagesCounter: ~

    OpenDxp\Bundle\PersonalizationBundle\Targeting\DataProvider\VisitedPagesCounter: ~

    #
    # CONDITIONS
    #

    OpenDxp\Bundle\PersonalizationBundle\Targeting\ConditionFactoryInterface: '@OpenDxp\Bundle\PersonalizationBundle\Targeting\ConditionFactory'

    OpenDxp\Bundle\PersonalizationBundle\Targeting\ConditionFactory:
        arguments:
            $conditions: '%opendxp_personalization.targeting.conditions%'

    opendxp_personalization.targeting.condition_matcher.expression_language:
        class: Symfony\Component\ExpressionLanguage\ExpressionLanguage
        arguments:
            $cache: '@opendxp.cache.pool'

    OpenDxp\Bundle\PersonalizationBundle\Targeting\ConditionMatcherInterface: '@OpenDxp\Bundle\PersonalizationBundle\Targeting\ConditionMatcher'

    OpenDxp\Bundle\PersonalizationBundle\Targeting\ConditionMatcher:
        arguments:
            $expressionLanguage: '@opendxp_personalization.targeting.condition_matcher.expression_language'

    #
    # ACTION HANDLERS
    #

    OpenDxp\Bundle\PersonalizationBundle\Targeting\ActionHandler\ActionHandlerInterface: '@OpenDxp\Bundle\PersonalizationBundle\Targeting\ActionHandler\DelegatingActionHandler'

    OpenDxp\Bundle\PersonalizationBundle\Targeting\ActionHandler\DelegatingActionHandler: ~

    OpenDxp\Bundle\PersonalizationBundle\Targeting\ActionHandler\AssignTargetGroup: ~

    OpenDxp\Bundle\PersonalizationBundle\Targeting\ActionHandler\Redirect: ~

    OpenDxp\Bundle\PersonalizationBundle\Targeting\ActionHandler\CodeSnippet: ~


    #
    # DOCUMENT HANDLING
    #

    OpenDxp\Bundle\PersonalizationBundle\Targeting\Document\DocumentTargetingConfigurator:
        public: true


    #
    # TARGETING CODE
    #

    OpenDxp\Bundle\PersonalizationBundle\Targeting\Code\TargetingCodeGenerator: ~

    #
    # TOOLBAR AND PROFILER
    #

    OpenDxp\Bundle\PersonalizationBundle\Targeting\Debug\TargetingDataCollector: ~

    OpenDxp\Bundle\PersonalizationBundle\Targeting\Debug\OverrideHandler:
        lazy: true
        arguments:
            # injected by TargetingOverrideHandlersPass
            $overrideHandlers: '?@'

    OpenDxp\Bundle\PersonalizationBundle\Targeting\Debug\Override\DocumentTargetingOverrideHandler:
        tags:
            - { name: opendxp_personalization.targeting.override_handler, priority: 500 }

    OpenDxp\Bundle\PersonalizationBundle\Targeting\Debug\Override\LanguageOverrideHandler:
        tags:
            - { name: opendxp_personalization.targeting.override_handler, priority: 475 }

    OpenDxp\Bundle\PersonalizationBundle\Targeting\Debug\Override\DeviceOverrideHandler:
        tags:
            - { name: opendxp_personalization.targeting.override_handler, priority: 450 }

    OpenDxp\Bundle\PersonalizationBundle\Targeting\Debug\Override\LocationOverrideHandler:
        tags:
            - { name: opendxp_personalization.targeting.override_handler, priority: 425 }

    OpenDxp\Bundle\CoreBundle\EventListener\Frontend\FullPageCacheListener:
        class: OpenDxp\Bundle\PersonalizationBundle\Targeting\EventListener\TargetingFullPageCacheListener
        public: true
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 120 }
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: -120 }
            - { name: kernel.event_listener, event: kernel.response, method: stopPropagationCheck, priority: 100 }

    OpenDxp\Bundle\PersonalizationBundle\DataCollector\OpenDxpTargetingDataCollector:
        tags:
            -   name: data_collector
                template: '@OpenDxpPersonalization/Profiler/targeting_data_collector.html.twig'
                id: 'opendxp_targeting'
                priority: 312

    #
    # Event Listeners
    #

    OpenDxp\Bundle\PersonalizationBundle\EventListener\IndexSettingsListener:
        tags:
            - { name: kernel.event_listener, event: opendxp.admin.indexAction.settings, method: indexSettings }

    OpenDxp\Bundle\PersonalizationBundle\Targeting\EventListener\Frontend\TargetingElementListener: ~

    OpenDxp\Bundle\PersonalizationBundle\Targeting\EventListener\Frontend\TargetingDocumentRendererListener: ~

    OpenDxp\Bundle\PersonalizationBundle\Targeting\EventListener\RenderletListener: ~

